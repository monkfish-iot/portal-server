#
# MonkFish 云侧 nginx 站点 —— portal-server 协同配置
#
# 链路：STA → webauthd 302 → AP nginx(:20001, location / { proxy_pass $proxy_pass; })
#      → 本 nginx(:9091) → portal-server(127.0.0.1:19090)
#
# 分工（base 模式，x_accel: false）：
#   - GET /{device_id}/?wlanuserip=...  → proxy 给 portal-server：动态选模板、
#     读 {root}/{code}/index.html、注入 <base href="/p/{code}/"> 后返回 HTML
#   - GET /p/{code}/<资源>              → nginx alias 直接回文件（sendfile，不进应用）
#   - GET /_portal_internal/...         → internal，仅 x_accel 模式使用，外网 404
#
# x_accel: true 时（模板资源须用 /p/{code}/... 绝对路径引用）：
#   portal-server 只回 X-Accel-Redirect: /_portal_internal/{code}/index.html 响应头，
#   即"应用告知 nginx 真正的页面路径"，由 ② internal location 直接回文件。
#
# 认证请求 /v1/login、/v1/get_portal_text 不会到达云端：AP nginx 的同名 location
# 优先匹配，直接代理到本机 webauthd(127.0.0.1:20002)。
#
# 部署：cp 本文件到 /etc/nginx/conf.d/portal-server.conf && nginx -t && systemctl reload nginx
# 对外端口须与设备 webauthd 的 proxy_pass/portal_url 端口一致（统一 9091）。

server {
    listen 9091;
    server_name _;

    # 模板根目录（与 portal-server 的 template_root 指向同一目录）
    root /opt/portal-server/data/portal-templates;

    # ① 模板静态资源：nginx 直接回文件，应用不参与
    location /p/ {
        alias /opt/portal-server/data/portal-templates/;
        try_files $uri =404;
        expires 10m;
        add_header Cache-Control "public";
    }

    # ② X-Accel-Redirect 内部路径：仅应用可指向（internal），外部直接访问 404
    location /_portal_internal/ {
        internal;
        alias /opt/portal-server/data/portal-templates/;
    }

    # ③ 入口与设备路径：动态选模板 → portal-server 回 HTML（含 <base> 注入）或 X-Accel 头
    location / {
        proxy_pass http://127.0.0.1:19090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Portal-Version 2;   # 与 AP 侧 webauthd.init 透传头保持一致
    }
}
